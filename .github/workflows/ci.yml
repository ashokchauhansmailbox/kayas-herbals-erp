name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Ruff + MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.5.0 mypy==1.10.0 types-PyYAML PyYAML
      - name: Ruff
        run: ruff check backend/app backend/tests backend/migrations scripts
      - name: MyPy
        run: mypy --config-file backend/mypy.ini backend/app

  tests-and-migrations:
    name: Pytest + Alembic cycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaya
          POSTGRES_PASSWORD: kaya_dev
          POSTGRES_DB: kaya_bos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaya -d kaya_bos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://kaya:kaya_dev@localhost:5432/kaya_bos
      DATABASE_URL_SYNC: postgresql+psycopg2://kaya:kaya_dev@localhost:5432/kaya_bos
      DATABASE_URL_TEST: postgresql+asyncpg://kaya:kaya_dev@localhost:5432/kaya_bos_test
      DATABASE_URL_TEST_SYNC: postgresql+psycopg2://kaya:kaya_dev@localhost:5432/kaya_bos_test
      SUPABASE_JWT_SECRET: ci-only-dummy-secret
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary PyYAML
      - name: Create test database
        run: |
          PGPASSWORD=kaya_dev psql -h localhost -U kaya -d kaya_bos \
            -c "CREATE DATABASE kaya_bos_test OWNER kaya;"
      - name: Alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic downgrade base
        working-directory: backend
        run: alembic downgrade base
      - name: Alembic upgrade head (final)
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic check (no drift)
        working-directory: backend
        run: alembic check
      - name: Pytest
        working-directory: backend
        run: pytest -v

  openapi-contract:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    env:
      # Non-DB endpoints only — no Postgres required for openapi generation.
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
      DATABASE_URL_SYNC: postgresql+psycopg2://dummy:dummy@localhost:5432/dummy
      SUPABASE_JWT_SECRET: ci-only-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install PyYAML
      - name: Regenerate & compare
        run: python scripts/check_openapi_drift.py
