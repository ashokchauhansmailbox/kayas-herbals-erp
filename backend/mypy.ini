[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
strict_optional = True
ignore_missing_imports = True
no_implicit_optional = True
show_error_codes = True
plugins = sqlalchemy.ext.mypy.plugin

# Sprint 1.1 baseline: model modules use SQLAlchemy 2 typed API; other modules
# will be tightened per-sub-sprint. Silence errors in still-thin modules for now.
[mypy-app.models.*]
disallow_untyped_defs = False

[mypy-app.db.*]
disallow_untyped_defs = False

[mypy-migrations.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True
